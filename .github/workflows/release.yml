name: Release

on:
  release:
    types: [published]
  # Escape hatch: publishes whatever version the selected ref carries.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing + provenance

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Verify package.json matches the release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: node -e "const pkg=require('./package.json'); const tag=process.env.TAG.replace(/^v/,''); if (pkg.version !== tag) throw new Error(pkg.version + ' !== ' + tag)"
      - run: npx prettier --check .
      - run: npm audit --omit=dev
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:playwright
      - name: Verify packed package contents
        run: |
          npm pack --dry-run --ignore-scripts --json > /tmp/package-manifest.json
          node <<'NODE'
          const manifest = require('/tmp/package-manifest.json')[0];
          const allowed = /^(CHANGELOG\.md|LICENSE|README\.md|package\.json|redis\.(?:js|html))$|^(?:icons|examples|docs\/assets\/readme)\//;
          const unexpected = manifest.files.map((file) => file.path).filter((file) => !allowed.test(file));
          if (unexpected.length > 0) {
            throw new Error(`Unexpected package files: ${unexpected.join(', ')}`);
          }
          console.log(`Verified ${manifest.entryCount} package files`);
          NODE
      # Trusted publishing supplies the credential over OIDC — no npm token.
      - run: npm publish --access public --provenance
