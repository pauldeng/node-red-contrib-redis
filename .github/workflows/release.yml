name: Release

on:
  release:
    types: [published]
  # Escape hatch: publishes whatever version the selected ref carries.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing + provenance

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Verify package.json matches the release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: node -e "const pkg=require('./package.json'); const tag=process.env.TAG.replace(/^v/,''); if (pkg.version !== tag) throw new Error(pkg.version + ' !== ' + tag)"
      - run: npx prettier --check .
      - run: npm audit --omit=dev
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:playwright
      - run: npm pack --dry-run
      # Trusted publishing supplies the credential over OIDC — no npm token.
      - run: npm publish --access public --provenance
